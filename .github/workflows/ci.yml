name: CI

# push runs only on main (feature branches get their run via pull_request),
# so a branch with an open PR runs CI once per commit, not twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
